<!-- Si no hay elementos en la lista, muestra el mensaje vacío -->
@if (data().length === 0) {
  <p class="sin-datos">No hay datos para mostrar</p>
} @else {
  <div class="tabla-contenedor">
    <table mat-table [dataSource]="data()">
      <!-- Columnas dinámicas calculadas automáticamente -->
      @for (col of columnas(); track col.campo) {
        <ng-container [matColumnDef]="col.campo">
          <th mat-header-cell *matHeaderCellDef>{{ col.titulo }}</th>
          <td mat-cell *matCellDef="let fila">{{ fila[col.campo] }}</td>
        </ng-container>
      }

      <!-- Columna para botones de acción -->
      @if (permitirEliminar()) {
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acción</th>
          <td mat-cell *matCellDef="let fila">
            <button class="boton-eliminar" (click)="eliminar.emit(fila.id)">Eliminar</button>
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let fila; columns: displayedColumns()"></tr>
    </table>
  </div>
}
